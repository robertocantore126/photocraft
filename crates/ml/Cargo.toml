[package]
name = "photocraft-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local AI models (ONNX Runtime, loaded at run time): BiRefNet and EfficientSAM for the Object Selection tool, ported from Fotox"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

# ONNX Runtime is a native library loaded at run time; the web build has no AI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }

# DirectML execution provider on Windows.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17", "directml"] }
